name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Android APK & Google Play App Bundle (AAB)
      run: |
        cd android
        gradle assembleDebug bundleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

    - name: Publish Build Logs to Summary
      if: always()
      run: |
        if [ -f /tmp/gradle_build.log ]; then
          echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test APK (For Phones & Viber)
      uses: actions/upload-artifact@v4
      with:
        name: Parenting-Project-Myanmar-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Google Play Store Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: Parenting-Project-Myanmar-PlayStore-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
